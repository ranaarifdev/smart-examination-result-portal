<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | FCET Smart Portal</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-hover);
        }

        .auth-card {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .auth-image {
            flex: 1;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.8) 0%, rgba(30, 58, 138, 0.8) 100%), url('https://images.unsplash.com/photo-1543269865-cbf427effbad?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            text-align: center;
        }

        [data-theme="dark"] .auth-image {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(6, 182, 212, 0.8) 100%), url('https://images.unsplash.com/photo-1543269865-cbf427effbad?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
        }

        .auth-image i {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        .auth-form-wrapper {
            flex: 1;
            padding: 3rem;
            background: var(--bg-card);
            max-height: 90vh;
            overflow-y: auto;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            transition: all var(--transition-fast);
        }

        .auth-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        /* Email verification UI */
        .verification-ui {
            display: none;
            text-align: center;
            padding: 2rem 0;
            animation: fadeIn 0.3s ease;
        }

        .verification-ui i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        @media (max-width: 768px) {
            .auth-image {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-image">
                <i class="ph-fill ph-student"></i>
                <h2>Join FCET</h2>
                <p>Register for your portal access</p>
            </div>

            <div class="auth-form-wrapper">
                <a href="login.html" class="back-link"><i class="ph ph-arrow-left"></i> Back to Login</a>
                <h3 style="margin-bottom: 1.5rem;">Create Account</h3>

                <div class="auth-tabs">
                    <div class="auth-tab active" onclick="switchTab('student')">Student</div>
                    <div class="auth-tab" onclick="switchTab('teacher')">Teacher</div>
                </div>

                <!-- Step 1: Registration Forms -->
                <div id="forms-container">
                    <!-- Student Registration -->
                    <form id="student-form" class="auth-form active" onsubmit="handleSignup(event, 'student')">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Student ID</label>
                            <input type="text" class="form-control" placeholder="e.g. 3400002312" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">University Email</label>
                            <input type="email" class="form-control" placeholder="student@fcet.edu.pk" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Select Program</label>
                            <select class="form-control" required>
                                <option value="">-- Choose Program --</option>
                                <option>Computer Science</option>
                                <option>Information Technology</option>
                                <option>Data Science</option>
                                <option>Software Engineering</option>
                                <option>Artificial Intelligence</option>
                                <option>Cyber Security</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Create Password</label>
                            <input type="password" class="form-control" placeholder="At least 8 characters" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="btn-student">Register as Student</button>
                    </form>

                    <!-- Teacher Registration -->
                    <form id="teacher-form" class="auth-form" onsubmit="handleSignup(event, 'teacher')">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">CNIC</label>
                            <input type="text" class="form-control" placeholder="e.g. 35202-1234567-1" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Faculty Type</label>
                            <select class="form-control" required>
                                <option value="permanent">Permanent Faculty</option>
                                <option value="visiting">Visiting Faculty</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">University Email</label>
                            <input type="email" class="form-control" placeholder="faculty@fcet.edu.pk" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Create Password</label>
                            <input type="password" class="form-control" placeholder="At least 8 characters" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="btn-teacher">Register as Teacher</button>
                    </form>
                </div>

                <!-- Step 2: Email Verification UI -->
                <div id="verification-ui" class="verification-ui">
                    <i class="ph-duotone ph-envelope-open"></i>
                    <h3>Verify Your Email</h3>
                    <p class="text-muted mt-2 mb-4">We've sent a 6-digit verification code to your email address. Please enter it below.</p>
                    
                    <div style="display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 2rem;">
                        <input type="text" class="form-control" style="width: 50px; text-align: center; font-size: 1.5rem; font-weight: bold;" maxlength="1">
                        <input type="text" class="form-control" style="width: 50px; text-align: center; font-size: 1.5rem; font-weight: bold;" maxlength="1">
                        <input type="text" class="form-control" style="width: 50px; text-align: center; font-size: 1.5rem; font-weight: bold;" maxlength="1">
                        <input type="text" class="form-control" style="width: 50px; text-align: center; font-size: 1.5rem; font-weight: bold;" maxlength="1">
                        <input type="text" class="form-control" style="width: 50px; text-align: center; font-size: 1.5rem; font-weight: bold;" maxlength="1">
                        <input type="text" class="form-control" style="width: 50px; text-align: center; font-size: 1.5rem; font-weight: bold;" maxlength="1">
                    </div>

                    <button class="btn btn-primary" style="width: 100%;" onclick="verifyEmail()">Verify & Continue</button>
                    <p class="text-muted mt-3" style="font-size: 0.875rem;">Didn't receive code? <a href="#" onclick="location.reload()">Resend</a></p>
                </div>

            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>
    <script>
        function switchTab(role) {
            document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));

            if(role === 'student') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('student-form').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('teacher-form').classList.add('active');
            }
        }

        let pendingRole = '';
        let registrationData = {};

        async function handleSignup(e, role) {
            e.preventDefault();
            const btn = document.getElementById(`btn-${role}`);
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin"></i> Processing...`;
            btn.disabled = true;
            pendingRole = role;

            const form = document.getElementById(`${role}-form`);
            const inputs = form.querySelectorAll('input, select');
            
            registrationData = {
                role: role,
                name: inputs[0].value,
                reference_id: inputs[1].value,
                program: role === 'student' ? inputs[3].value : null,
                email: role === 'student' ? inputs[2].value : inputs[3].value,
                password: role === 'student' ? inputs[4].value : inputs[4].value
            };

            try {
                const response = await apiFetch('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify(registrationData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast('Registration initiated. Please verify email.', 'info');
                    document.querySelector('.auth-tabs').style.display = 'none';
                    document.getElementById('forms-container').style.display = 'none';
                    document.getElementById('verification-ui').style.display = 'block';
                } else {
                    showToast(data.error || 'Registration failed', 'error');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                showToast('Server error. Try again.', 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function verifyEmail() {
            const btn = document.querySelector('.verification-ui .btn-primary');
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin"></i> Verifying...`;
            btn.disabled = true;

            setTimeout(() => {
                if(pendingRole === 'student') window.location.href = 'student-dashboard.html';
                if(pendingRole === 'teacher') window.location.href = 'teacher-dashboard.html';
            }, 1500);
        }
    </script>
</body>
</html>
